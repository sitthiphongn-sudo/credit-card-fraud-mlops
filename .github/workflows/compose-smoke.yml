name: compose-smoke

on:
  pull_request:
    branches: [main]

jobs:
  fresh-checkout:
    if: github.event.pull_request.head.ref == 'feat/ci-reproducible-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Start full stack from raw data
        run: docker compose up -d --build --force-recreate --wait
      - name: Verify service and generated evidence
        run: |
          docker compose ps
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          health = json.load(urllib.request.urlopen("http://localhost:8000/health"))
          assert health["status"] == "ok", health
          version = json.loads(Path("data/processed/data_version.json").read_text())
          gate = json.loads(Path("reports/pipeline-gate.json").read_text())
          assert gate["status"] == "pass", gate
          assert sum(version["rows"].values()) == 284807, version
          print("fresh-checkout Compose smoke passed", health)
          PY
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 mlflow trainer api
      - name: Save pipeline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-smoke-${{ github.run_id }}
          path: |
            reports/pipeline-gate.json
            data/processed/data_version.json
          if-no-files-found: warn
