name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt && pip install -e .
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
        env:
          PYTHONPATH: .

  data-validation:
    needs: code-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt && pip install -e .
      - name: Validate sample data
        shell: bash
        run: |
          python -m fraud.validate data/sample/valid.csv

          for file in data/sample/bad_*.csv; do
            status=0
            python -m fraud.validate "$file" || status=$?
            if [ "$status" -ne 1 ]; then
              echo "Expected exit 1 for $file, got $status"
              exit 1
            fi
          done

  model-gate:
    needs: data-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "TODO(กันตพัฒน์/ธรรมรักษ์) เทรนบน sample แล้วรัน gate — fail ถ้าไม่ผ่านเกณฑ์"
