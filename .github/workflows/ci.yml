name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt && pip install -e .
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
        env:
          PYTHONPATH: .

  data-validation:
    needs: code-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt && pip install -e .
      # TODO(กันตพัฒน์): ดึง sample ข้อมูลจริงแล้วรัน python -m fraud.validate
      - name: Schema test on sample data
        run: pytest -q tests/test_features.py -k data

  model-gate:
    needs: data-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "TODO(กันตพัฒน์/ธรรมรักษ์) เทรนบน sample แล้วรัน gate — fail ถ้าไม่ผ่านเกณฑ์"
