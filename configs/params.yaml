# ค่าคงที่และเกณฑ์ทั้งหมดอยู่ที่นี่ ทุกส่วน (pipeline, gate, API, monitoring) อ่านจากไฟล์นี้
seed: 42

data:
  raw_path: data/raw/creditcard.csv
  processed_dir: data/processed
  target: Class
  split: {train: 0.6, val: 0.2, test: 0.2}   # เรียงตาม Time ไม่สุ่ม

cost:
  currency: EUR             # Amount ในชุดข้อมูล ULB เป็นยูโร
  review_fee_thb: 50        # ต้นทุน false positive ต่อรายการ
  min_alert_precision: 0.80 # ทุก 5 รายการที่แจ้งเตือน ต้องเป็นโกงจริงอย่างน้อย 4
  eur_to_thb: 38.03         # 50 / 38.03 ≈ 1.31 EUR

gate:
  min_recall: 0.75
  max_pr_auc_drop: 0.005
  max_p95_latency_ms: 100
  max_model_mb: 50

monitoring:
  drift_share: 0.10
  max_recall_drop: 0.10
  concept_gap: 0.10
  max_error_rate: 0.01
  stale_after_seconds: 86400

  # เพิ่ม max_fraud_prediction_rate ภายหลัง เมื่อวัด baseline จาก Period 1-2 แล้ว
  # ตัวอย่าง: max_fraud_prediction_rate: 0.0033

  simulation:
    amount_multiplier: 1.8
    v14_shift_mean: 1.5
    v17_shift_mean: 1.5
    shift_std: 0.3
    small_amount_quantile: 0.25
    concept_flip_share: 0.05

registry:
  model_name: fraud-detector
  champion_alias: champion
  challenger_alias: challenger