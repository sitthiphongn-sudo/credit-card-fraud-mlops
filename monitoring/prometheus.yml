global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: fraud-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: fraud-monitoring-batch
    static_configs:
      - targets: ["host.docker.internal:9108"]
