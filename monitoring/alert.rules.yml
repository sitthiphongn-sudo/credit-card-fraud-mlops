groups:
  - name: system-health
    rules:
      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(fraud_request_latency_seconds_bucket[1m]))) > 0.1
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "p95 latency เกิน SLO 100 ms"}
